<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 1194" width="784" height="1194">
  <title>Isometric zig-zag block figure — axonometric assemble</title>
  <defs>
    <linearGradient id="g-topBar" gradientUnits="userSpaceOnUse" x1="0" y1="235.8" x2="0" y2="394.9"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dedede"/></linearGradient>
    <linearGradient id="g-riser" gradientUnits="userSpaceOnUse" x1="0" y1="368.1" x2="0" y2="582.8"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e0e0e0"/></linearGradient>
    <linearGradient id="g-lowerLeft" gradientUnits="userSpaceOnUse" x1="0" y1="739.7" x2="0" y2="956.3"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e0e0e0"/></linearGradient>
    <linearGradient id="g-lowerRight" gradientUnits="userSpaceOnUse" x1="0" y1="770.0" x2="0" y2="1040.6"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5d5d5"/></linearGradient>
    <linearGradient id="g-shelf" gradientUnits="userSpaceOnUse" x1="0" y1="300.0" x2="0" y2="512.6"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e0e0e0"/></linearGradient>
    <linearGradient id="g-column" gradientUnits="userSpaceOnUse" x1="0" y1="640.0" x2="0" y2="851.4"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e0e0e0"/></linearGradient>
    <linearGradient id="g-greenBar" gradientUnits="userSpaceOnUse" x1="104.6" y1="0" x2="406.1" y2="0"><stop offset="0" stop-color="#b4f9ba"/><stop offset="1" stop-color="#67df70"/></linearGradient>
    <filter id="softShadow" x="-40%" y="-60%" width="180%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="25.6"/></filter>
  </defs>
  <style>
    .blk, #shadow { will-change: transform, opacity; }
    @media (prefers-reduced-motion: reduce) { .blk, #shadow { animation: none !important; opacity: 1 !important; } }
    #lowerRight { animation: k-lowerRight 4.4s infinite; }
    @keyframes k-lowerRight {
      0%, 1.36%   { opacity:0; transform: translate(152px,86px); animation-timing-function: cubic-bezier(.16,1,.3,1); }
      20.68%, 88%  { opacity:1; transform: translate(0,0); }
      100%          { opacity:0; transform: translate(0,0); }
    }
    #lowerLeft { animation: k-lowerLeft 4.4s infinite; }
    @keyframes k-lowerLeft {
      0%, 4.77%   { opacity:0; transform: translate(-154px,86px); animation-timing-function: cubic-bezier(.16,1,.3,1); }
      24.09%, 88%  { opacity:1; transform: translate(0,0); }
      100%          { opacity:0; transform: translate(0,0); }
    }
    #column { animation: k-column 4.4s infinite; }
    @keyframes k-column {
      0%, 8.18%   { opacity:0; transform: translate(0px,-190px); animation-timing-function: cubic-bezier(.16,1,.3,1); }
      27.50%, 88%  { opacity:1; transform: translate(0,0); }
      100%          { opacity:0; transform: translate(0,0); }
    }
    #greenBar { animation: k-greenBar 4.4s infinite; }
    @keyframes k-greenBar {
      0%, 11.59%   { opacity:0; transform: translate(-152px,-86px); animation-timing-function: cubic-bezier(.16,1,.3,1); }
      30.91%, 88%  { opacity:1; transform: translate(0,0); }
      100%          { opacity:0; transform: translate(0,0); }
    }
    #shelf { animation: k-shelf 4.4s infinite; }
    @keyframes k-shelf {
      0%, 15.00%   { opacity:0; transform: translate(154px,-86px); animation-timing-function: cubic-bezier(.16,1,.3,1); }
      34.32%, 88%  { opacity:1; transform: translate(0,0); }
      100%          { opacity:0; transform: translate(0,0); }
    }
    #riser { animation: k-riser 4.4s infinite; }
    @keyframes k-riser {
      0%, 18.41%   { opacity:0; transform: translate(0px,-190px); animation-timing-function: cubic-bezier(.16,1,.3,1); }
      37.73%, 88%  { opacity:1; transform: translate(0,0); }
      100%          { opacity:0; transform: translate(0,0); }
    }
    #topBar { animation: k-topBar 4.4s infinite; }
    @keyframes k-topBar {
      0%, 21.82%   { opacity:0; transform: translate(-228px,-129px); animation-timing-function: cubic-bezier(.16,1,.3,1); }
      41.14%, 88%  { opacity:1; transform: translate(0,0); }
      100%          { opacity:0; transform: translate(0,0); }
    }
    #shadow { animation: k-shadow 4.4s infinite; }
    @keyframes k-shadow { 0%,1% {opacity:0} 25%,88% {opacity:1} 100% {opacity:0} }
  </style>
  <rect width="784" height="1194" fill="#ffffff"/>
  <g id="shadow"><polygon points="-65,958 375,752 815,958 375,1164" fill="#000000" fill-opacity="0.0395" filter="url(#softShadow)"/></g>
  <g id="blocks" stroke="#242424" stroke-width="1.8" stroke-linejoin="round">
