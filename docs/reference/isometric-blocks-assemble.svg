      <polygon fill="url(#g-shelf)" points="379.7,326.8 500.3,394.9 500.3,535.2 379.7,467.1"/>
      <polygon fill="#ffffff" points="594.9,206.6 715.5,274.7 500.3,394.9 379.7,326.8"/>
    </g>
    <g class="blk" id="lowerLeft">
      <polygon fill="#242424" points="408.1,714.9 222.4,816.4 222.4,956.3 408.1,853.6"/>
      <polygon fill="url(#g-lowerLeft)" points="103.8,747.5 222.4,816.4 222.4,956.3 103.8,884.8"/>
      <polygon fill="#ffffff" points="284.5,647.0 408.1,714.9 222.4,816.4 103.8,747.5"/>
    </g>
    <g class="blk" id="topBar">
      <polygon fill="#242424" points="620.6,186.8 500.3,258.2 500.3,394.9 620.6,326.8"/>
      <polygon fill="url(#g-topBar)" points="195.9,89.3 500.3,258.2 500.3,394.9 195.9,226.4"/>
      <polygon fill="#ffffff" points="316.4,20.2 620.6,186.8 500.3,258.2 195.9,89.3"/>
    </g>
    <g class="blk" id="riser">
      <polygon fill="#242424" points="500.3,394.9 408.1,445.7 408.1,582.8 500.3,531.9"/>
      <polygon fill="url(#g-riser)" points="289.0,376.7 408.1,445.7 408.1,582.8 289.0,513.4"/>
      <polygon fill="#ffffff" points="377.6,327.1 500.3,394.9 408.1,445.7 289.0,376.7"/>
