      <polygon fill="url(#g-column)" points="287.5,647.9 408.1,716.0 408.1,852.9 287.5,783.9"/>
      <polygon fill="#ffffff" points="408.1,583.8 528.7,651.9 408.1,716.0 287.5,647.9"/>
    </g>
    <g class="blk" id="greenBar">
      <polygon fill="#242424" points="528.7,516.4 408.1,582.8 408.1,716.0 528.7,651.9"/>
      <polygon fill="url(#g-greenBar)" points="103.8,409.3 408.1,582.8 408.1,716.0 103.8,546.9"/>
      <polygon fill="#b4f9bb" points="224.1,340.9 528.7,516.4 408.1,582.8 103.8,409.3"/>
    </g>
    <g class="blk" id="shelf">
