<svg xmlns="http://www.w3.org/2000/svg" width="960" height="462" viewBox="0 0 960 462" role="img" aria-label="Bar chart of primary drying time as a percentage of a typical cycle. For five per cent mannitol the optimised recipe falls from 100 per cent to 38 per cent. For five per cent sucrose it falls from 100 per cent to 50 per cent.">
  <!--
    The two reductions reproduce figures already reported for continuous
    recipes; they are not a novel measurement and the caption says so. Axis
    carries a label and a unit (SPEC 8.2.6). Token colours only (12.1).
  -->
  <rect width="960" height="462" fill="#FFFFFF"/>

  <g font-family="Switzer, 'Helvetica Neue', Arial, sans-serif">
    <text x="45" y="40" font-size="17" font-weight="600" fill="#101113">Primary drying time, optimised against typical</text>

    <!-- gridlines + y labels : y = 330 - value * 2.4 -->
    <g stroke="#E3E5E8" stroke-width="1">
      <line x1="180" y1="90"  x2="880" y2="90"/>
      <line x1="180" y1="150" x2="880" y2="150"/>
      <line x1="180" y1="210" x2="880" y2="210"/>
      <line x1="180" y1="270" x2="880" y2="270"/>
    </g>
    <g font-size="13" fill="#5E636A" text-anchor="end">
      <text x="168" y="95">100</text>
      <text x="168" y="155">75</text>
      <text x="168" y="215">50</text>
      <text x="168" y="275">25</text>
      <text x="168" y="335">0</text>
    </g>
    <text x="66" y="210" font-size="13" fill="#5E636A" text-anchor="middle" transform="rotate(-90 66 210)">Primary drying time (% of typical cycle)</text>

    <!-- baseline -->
    <line x1="180" y1="330" x2="880" y2="330" stroke="#101113" stroke-width="1.5"/>

    <!-- 5 % mannitol : 100 -> 38 -->
    <rect x="290" y="90"    width="90" height="240" fill="#FFFFFF" stroke="#101113" stroke-width="1.5"/>
    <rect x="400" y="238.8" width="90" height="91.2" fill="#A3EFAE" stroke="#101113" stroke-width="1.5"/>
    <text x="335" y="82"  font-size="14" fill="#5E636A" text-anchor="middle">100 %</text>
    <text x="445" y="231" font-size="14" font-weight="600" fill="#101113" text-anchor="middle">38 %</text>

    <!-- 5 % sucrose : 100 -> 50 -->
    <rect x="590" y="90"  width="90" height="240" fill="#FFFFFF" stroke="#101113" stroke-width="1.5"/>
    <rect x="700" y="210" width="90" height="120" fill="#A3EFAE" stroke="#101113" stroke-width="1.5"/>
    <text x="635" y="82"  font-size="14" fill="#5E636A" text-anchor="middle">100 %</text>
    <text x="745" y="202" font-size="14" font-weight="600" fill="#101113" text-anchor="middle">50 %</text>

    <!-- reduction brackets -->
    <g stroke="#48C862" stroke-width="1.5" fill="none">
      <path d="M 500 90 L 512 90 L 512 238.8 L 500 238.8"/>
      <path d="M 800 90 L 812 90 L 812 210 L 800 210"/>
    </g>
    <text x="520" y="169" font-size="13" fill="#5E636A">62 % faster</text>
    <text x="820" y="155" font-size="13" fill="#5E636A">50 % faster</text>

    <!-- x labels -->
    <g font-size="14" fill="#101113" text-anchor="middle">
      <text x="390" y="356">5 % mannitol</text>
      <text x="690" y="356">5 % sucrose</text>
    </g>

    <!-- legend -->
    <g font-size="13">
      <rect x="290" y="386" width="24" height="14" fill="#FFFFFF" stroke="#101113" stroke-width="1.5"/>
      <text x="324" y="398" fill="#101113">typical cycle conditions</text>
      <rect x="520" y="386" width="24" height="14" fill="#A3EFAE" stroke="#101113" stroke-width="1.5"/>
      <text x="554" y="398" fill="#101113">optimised policy</text>
    </g>
    <text x="45" y="430" font-size="13" fill="#5E636A">Both reductions are consistent with figures already published for continuous recipes. The result of this project is that</text>
    <text x="45" y="449" font-size="13" fill="#5E636A">they survive discretisation onto a standard controller.</text>
  </g>
</svg>
