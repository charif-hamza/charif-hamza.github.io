strings:
  fr:
    skipToContent: Aller au contenu
    # --- Home hero (§8.1.2): max two lines, max 12 words ---
    hero:
      - Ingénieur procédés.
      - J'optimise des procédés avec des méthodes discrètes.
    # At most two credential facts — the permitted leakage of §3.3.
    status: Double diplôme EIA-UIASS × IMT Mines Albi · Bourse d'excellence Fondation IMT
    # --- Intro (§8.1.3): 60-90 words, first person, no adjectives about yourself ---
    intro: >-
      Je travaille à la frontière entre la conception de procédés et
      l'optimisation discrète. Ce qui m'intéresse commence presque toujours de la
      même façon : une usine a une recette qui fonctionne, personne ne peut dire
      si c'est la meilleure, et l'espace de recherche est combinatoire. Depuis
      deux ans, je construis des modèles et des logiciels qui répondent à cette
      question avec un certificat plutôt qu'avec une intuition. Je termine
      actuellement un double diplôme à IMT Mines Albi et je m'oriente vers la
      recherche en génie des procédés.
