# =============================================================================
#  Site configuration — SPEC §9.3
#
#  "No string that appears on the site is hardcoded in a component."
#  Every user-visible label lives in this file or in content/*.md frontmatter.
#
#  French strings are passed through src/lib/typo.ts, which inserts the narrow
#  no-break spaces required before : ; ! ? and inside « » (SPEC §10.2).
#  Write them here with ordinary spaces; the build fixes the typography.
# =============================================================================

# --- Open decisions ----------------------------------------------------------
# Decisions that are still open but whose placeholders look like real values, so
# no pattern match can catch them. The build prints whatever is left in this
# list after every run. Delete an entry once it is settled.
# The full register, with what unblocks each one, is docs/TODO.md.
pending:
  - 'D1 domain: served from github.io; charif-hamza.com not registered yet'
  - 'email: Gmail address is temporary; replace with IMT Mines Albi or custom-domain address'

# --- Identity ----------------------------------------------------------------
name: Hamza Charif
# Surname-first form used for CV filenames (French HR filing convention, §8.4).
# Confirmed: given name = Hamza, surname = Charif.
surname: CHARIF
givenName: Hamza

# TODO(D1 §17): buy prenom-nom.com and .fr, serve .com, redirect .fr. Until the
# domain exists the site is served from GitHub Pages; switching later means
# changing this line and adding public/CNAME.
# This URL feeds canonical links, sitemap.xml, RSS and OG absolute URLs.
url: https://charif-hamza.github.io

# Temporary Gmail address. Replace it with the future IMT Mines Albi or
# custom-domain address once available.
# Used for every contact affordance on the site; there is no contact form (§11.1).
email: charifhamza1709@gmail.com

lang: fr # Layer 1 language, set on <html lang> (§10.2)
docLang: en # Layer 2 language — projects and writing (§10.3, D6)

tagline:
  fr: Élève-ingénieur en procédés, modélisation et optimisation.
  en: Engineering student in process modelling and optimisation.

# --- Social ------------------------------------------------------------------
# Leave a value empty to hide the link entirely. No social icon farm (§8.1.4).
social:
  github: https://github.com/charif-hamza
  linkedin: https://www.linkedin.com/in/hamza-charif-3a945a323/
  orcid: "" # §14 v1.2 — add when it exists
  repo: https://github.com/charif-hamza/charif-hamza.github.io # §17 D7: public repo

# --- CV (§8.4) ---------------------------------------------------------------
# The versioned PDFs live in public/cv/. Replacing them and updating the date
# below keeps every download affordance in sync from this one configuration.
cv:
  available: true
  fr:
    href: /cv/CHARIF_Hamza_CV_FR.pdf
    latest: /cv/CHARIF_Hamza_CV_FR.pdf
    size: '7 Ko'
    updated: 2026-08
  en:
    href: /cv/CHARIF_Hamza_CV_EN.pdf
    latest: /cv/CHARIF_Hamza_CV_EN.pdf
    size: '7 Ko'
    updated: 2026-08

# --- Fonts (§5.2.2) ----------------------------------------------------------
# TODO(D4): set to true once the WOFF2 files listed in src/styles/fonts.css are
# in public/fonts/. While false the site uses the fallback stacks and skips the
# preload hints, so there are no 404s on the critical path.
fonts:
  installed: false

# --- Feature flags (§9.3, §16) -----------------------------------------------
features:
  showWriting: false # Re-enable when the essays have been rewritten in the author's own voice.
  showProjectsIndex: true # nav entry appears once N > 4 (§3.1)
  showAbout: false # D9 §17 — later; it competes with the CV
  reduceMotionByDefault: false # user toggle in the footer overrides this (§7.6)

# --- Open Graph (§6.7, §12.3) ------------------------------------------------
og:
  # Poster-frame OG cards are generated at build as SVG (src/pages/og/[slug].svg.ts).
  # TODO(D-og): LinkedIn and Slack need raster. Run the documented rasterisation
  # step (docs/TODO.md → OG images) and flip this to "png".
  format: svg
  width: 1200
  height: 630

# --- Structured data (§12.3) -------------------------------------------------
# schema.org/Person on the home page. This is what makes you findable as a
# researcher later, so it is worth keeping accurate.
# alumniOf is deliberately empty: the degree is expected in 2028, so there is
# nothing to claim yet. Add IMT Mines Albi's exact legal name on graduation.
person:
  jobTitle: Process engineering student
  alumniOf: []
  knowsAbout:
    - Process modelling and simulation
    - Mathematical optimisation
    - Freeze-drying
    - Water treatment and process utilities
    - Industrial process improvement

# --- Analytics (§11.1) -------------------------------------------------------
# Plausible or Umami only. Google Analytics is not approved (consent banner).
analytics:
  provider: "" # "plausible" | "umami" | "" to disable
  domain: "" # TODO(D-analytics) e.g. charif-hamza.com
  src: "" # TODO(D-analytics) self-hosted script URL

# =============================================================================
#  Copy inventory (§10.4) — ~350 words. Rewrite a week after first writing.
# =============================================================================
strings:
  fr:
    skipToContent: Aller au contenu
    # --- Home hero (§8.1.2): max two lines, max 12 words ---
    # One line, not the two of the §8.1.2 draft. The second line ("J'optimise
    # des procédés avec des méthodes discrètes") said again, at display size,
    # what the intro paragraph two blocks down says better and in full — and at
    # --t-display it wrapped to three lines and swallowed the fold. The hero
    # states what you are; the intro states what you do.
    hero:
      - Du procédé au modèle, du modèle à la décision.
    # At most two credential facts — the permitted leakage of §3.3.
    status: Élève-ingénieur IFIE, IMT Mines Albi · Diplôme prévu en 2028
    # --- Intro (§8.1.3): 60-90 words, first person, no adjectives about yourself ---
    intro: >-
      Je suis élève-ingénieur en deuxième année à IMT Mines Albi. J'aime partir
      d'un procédé réel, en comprendre les contraintes, puis construire le bon
      niveau de modèle pour éclairer une décision : étude technico-économique
      d'une production d'eau ultrapure, optimisation d'un cycle batch ou
      simulation de la lyophilisation. Je recherche un stage de quatre mois à
      partir d'avril 2027, sur un sujet compatible avec le travail à distance,
      en génie des procédés, modélisation, optimisation ou logiciel scientifique.
    # Underlined in green inside the intro above. It must appear in `intro`
    # verbatim, or the paragraph renders unmarked rather than breaking.
    introHighlight: Je recherche un stage de quatre mois à partir d'avril 2027,
    cta:
