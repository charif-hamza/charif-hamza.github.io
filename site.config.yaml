# =============================================================================
#  Site configuration — SPEC §9.3
#
#  "No string that appears on the site is hardcoded in a component."
#  Every user-visible label lives in this file or in content/*.md frontmatter.
#
#  French strings are passed through src/lib/typo.ts, which inserts the narrow
#  no-break spaces required before : ; ! ? and inside « » (SPEC §10.2).
#  Write them here with ordinary spaces; the build fixes the typography.
# =============================================================================

# --- Open decisions ----------------------------------------------------------
# Decisions that are still open but whose placeholders look like real values, so
# no pattern match can catch them. The build prints whatever is left in this
# list after every run. Delete an entry once it is settled.
# The full register, with what unblocks each one, is docs/TODO.md.
pending:
  - 'D1 domain — served from github.io; charif-hamza.com not registered yet'
  - 'email — contact@charif-hamza.com is a placeholder'
  - 'T5 surname order — assumed given name Charif, surname Hamza (CV filenames)'
  - 'T6 school legal names in person.alumniOf'

# --- Identity ----------------------------------------------------------------
name: Charif Hamza
# Surname-first form used for CV filenames (French HR filing convention, §8.4).
# TODO(D-name): confirm which of "Charif" / "Hamza" is the surname. Assumed:
#   given name = Charif, surname = Hamza  ->  HAMZA-Charif-CV-FR-2026-07.pdf
surname: HAMZA
givenName: Charif

# TODO(D1 §17): buy prenom-nom.com and .fr, serve .com, redirect .fr. Until the
# domain exists the site is served from GitHub Pages; switching later means
# changing this line and adding public/CNAME.
# This URL feeds canonical links, sitemap.xml, RSS and OG absolute URLs.
url: https://charif-hamza.github.io

# TODO(D-email): replace with the real contact address before launch.
# Used for every contact affordance on the site; there is no contact form (§11.1).
email: contact@charif-hamza.com

lang: fr # Layer 1 language, set on <html lang> (§10.2)
docLang: en # Layer 2 language — projects and writing (§10.3, D6)

tagline:
  fr: Ingénieur procédés — optimisation discrète appliquée aux procédés.
  en: Process engineer — discrete optimisation applied to process design.

# --- Social ------------------------------------------------------------------
# Leave a value empty to hide the link entirely. No social icon farm (§8.1.4).
social:
  github: https://github.com/charif-hamza
  linkedin: https://www.linkedin.com/in/TODO-linkedin-handle # TODO(D-social)
  orcid: "" # §14 v1.2 — add when it exists
  repo: https://github.com/charif-hamza/charif-hamza.github.io # §17 D7: public repo

# --- CV (§8.4) ---------------------------------------------------------------
# TODO(D-cv): drop the two PDFs in public/cv/ using exactly these filenames.
# Until they exist the buttons still render (S1 requires them above the fold)
# but they will 404. `available: false` surfaces a visible note on /cv.
cv:
  available: false
  fr:
    href: /cv/HAMZA-Charif-CV-FR-2026-07.pdf
    latest: /cv/latest-fr.pdf
    size: TODO # e.g. "312 Ko"
    updated: 2026-07 # TODO: regenerate the date suffix on each update
  en:
    href: /cv/HAMZA-Charif-CV-EN-2026-07.pdf
    latest: /cv/latest-en.pdf
    size: TODO
    updated: 2026-07

# --- Fonts (§5.2.2) ----------------------------------------------------------
# TODO(D4): set to true once the WOFF2 files listed in src/styles/fonts.css are
# in public/fonts/. While false the site uses the fallback stacks and skips the
# preload hints, so there are no 404s on the critical path.
fonts:
  installed: false

# --- Feature flags (§9.3, §16) -----------------------------------------------
features:
  showWriting: true # flip to false until 2 pieces exist (§16 "Empty writing section")
  showProjectsIndex: true # nav entry appears once N > 4 (§3.1)
  showAbout: false # D9 §17 — later; it competes with the CV
  reduceMotionByDefault: false # user toggle in the footer overrides this (§7.6)

# --- Open Graph (§6.7, §12.3) ------------------------------------------------
og:
  # Poster-frame OG cards are generated at build as SVG (src/pages/og/[slug].svg.ts).
  # TODO(D-og): LinkedIn and Slack need raster. Run the documented rasterisation
  # step (docs/TODO.md → OG images) and flip this to "png".
  format: svg
  width: 1200
  height: 630

# --- Structured data (§12.3) -------------------------------------------------
# schema.org/Person on the home page. This is what makes you findable as a
# researcher later, so it is worth keeping accurate.
# TODO(D-person): confirm the exact legal names of both schools before launch.
person:
  jobTitle: Process systems engineer
  alumniOf:
    - IMT Mines Albi
    - EIA-UIASS
  knowsAbout:
    - Process systems engineering
    - Discrete optimisation
    - Mixed-integer linear programming
    - Freeze-drying
    - Process design

# --- Analytics (§11.1) -------------------------------------------------------
# Plausible or Umami only. Google Analytics is not approved (consent banner).
analytics:
  provider: "" # "plausible" | "umami" | "" to disable
  domain: "" # TODO(D-analytics) e.g. charif-hamza.com
  src: "" # TODO(D-analytics) self-hosted script URL

# =============================================================================
#  Copy inventory (§10.4) — ~350 words. Rewrite a week after first writing.
