<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Switzer, 'Helvetica Neue', Arial, sans-serif">
<style>
  :root{--paper:#FFFFFF;--field:#F2F2F1;--ink-900:#101113;--ink-500:#5E636A;
        --green-100:#DFFAE2;--green-200:#C2F5C9;--green-300:#A3EFAE;
        --green-400:#7FE18E;--green-500:#48C862;--green-700:#1E7A38;
        --iso-lit:#FAFAFA;--iso-shadow:#232427;
        --shadow-ground:rgb(127 225 142 / .22);--shadow-ground-neutral:rgb(16 17 19 / .08);
        --iso-stroke-width:1.25;}
  .iso{stroke:var(--iso-shadow);stroke-width:var(--iso-stroke-width);stroke-linejoin:miter;vector-effect:non-scaling-stroke}
  .iso-face--top{fill:var(--iso-top);vector-effect:non-scaling-stroke}
  .iso-face--left{fill:var(--iso-left);vector-effect:non-scaling-stroke}
  .iso-face--right{fill:var(--iso-right);vector-effect:non-scaling-stroke}
  .iso-edge{fill:none;vector-effect:non-scaling-stroke}
  .iso--light{--iso-top:var(--paper);--iso-left:var(--iso-lit);--iso-right:var(--iso-shadow)}
  .iso--dark{--iso-top:var(--paper);--iso-left:var(--iso-shadow);--iso-right:var(--iso-shadow)}
  .iso--accent{--iso-top:var(--green-200);--iso-left:var(--iso-accent-left,var(--green-300));--iso-right:var(--iso-shadow)}
  .iso--accent-edge{--iso-top:var(--paper);--iso-left:var(--iso-accent-left,var(--green-300));--iso-right:var(--iso-shadow)}
  .iso--accent-soft{--iso-top:var(--paper);--iso-left:var(--iso-accent-soft,var(--green-100));--iso-right:var(--iso-shadow)}
  .iso--ghost{opacity:.3;stroke-dasharray:3.5 3.5}
  .iso--frame{fill:none;stroke:var(--green-700);stroke-dasharray:4 3}
  .iso-grain{opacity:.45;mix-blend-mode:multiply}
  .iso-ground{stroke:none;fill:var(--ground)}
  .motif{--ground:var(--shadow-ground-neutral)}
  .motif[data-surface="green"]{--ground:var(--shadow-ground)}
  .og-title{font-size:64px;font-weight:700;letter-spacing:-0.02em;fill:#101113}
  .og-sub{font-size:28px;font-weight:400;fill:#3A3D42}
  .og-meta{font-size:22px;font-weight:500;letter-spacing:0.02em;fill:#5E636A}
</style>
<rect width="1200" height="630" fill="#F2F2F1"/>
<rect x="48" y="48" width="1104" height="534" rx="28" fill="#FFFFFF"/>
<svg x="730" y="130" width="370" height="370" class="motif" viewBox="-64.23400000000001 -36 114 114" data-surface="white" data-fit="square" style="--iso-accent-left:url(#iso3-accent);--iso-accent-soft:url(#iso3-soft);--iso-aspect:105.76599999999999/114" role="presentation" aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="iso3-accent" x1="0" y1="0" x2="0.55" y2="1"><stop offset="0%" stop-color="var(--green-200)"></stop><stop offset="100%" stop-color="var(--green-500)"></stop></linearGradient><linearGradient id="iso3-soft" x1="0" y1="0" x2="0.55" y2="1"><stop offset="0%" stop-color="var(--green-100)"></stop><stop offset="100%" stop-color="var(--green-400)"></stop></linearGradient><filter id="iso3-cast" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"></feGaussianBlur></filter><filter id="iso3-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="3" seed="4"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix><feComponentTransfer><feFuncA type="linear" slope="0.85" intercept="0"></feFuncA></feComponentTransfer></filter><linearGradient id="iso3-grainfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity="0"></stop><stop offset="40%" stop-color="#fff" stop-opacity="0"></stop><stop offset="100%" stop-color="#fff" stop-opacity="1"></stop></linearGradient><mask id="iso3-grainmask"><rect x="-56" y="-36" width="114" height="114" fill="url(#iso3-grainfade)"></rect></mask><clipPath id="iso3-lit"><polygon points="-51.962,30 -10.392,54 -10.392,12 -51.962,-12"></polygon></clipPath></defs><path class="iso-ground" d="M-39.282,38.28Q-53,46.2 -39.282,54.12L-16.835,67.08Q-3.117,75 10.601,67.08L33.048,54.12Q46.766,46.2 33.048,38.28L10.601,25.32Q-3.117,17.4 -16.835,25.32Z" filter="url(#iso3-cast)"></path><g class="iso iso--accent-edge"><polygon class="iso-face--right" points="25.981,33 20.785,36 20.785,-6 25.981,-9"></polygon><polygon class="iso-face--left" points="-20.785,12 20.785,36 20.785,-6 -20.785,-30"></polygon><polygon class="iso-face--top" points="-15.588,-33 25.981,-9 20.785,-6 -20.785,-30"></polygon></g><g class="iso iso--accent-soft"><polygon class="iso-face--right" points="15.588,39 0,48 0,6 15.588,-3"></polygon><polygon class="iso-face--left" points="-41.569,24 0,48 0,6 -41.569,-18"></polygon><polygon class="iso-face--top" points="-25.981,-27 15.588,-3 0,6 -41.569,-18"></polygon></g><g class="iso iso--light"><polygon class="iso-face--right" points="-5.196,51 -10.392,54 -10.392,12 -5.196,9"></polygon><polygon class="iso-face--left" points="-51.962,30 -10.392,54 -10.392,12 -51.962,-12"></polygon><polygon class="iso-face--top" points="-46.765,-15 -5.196,9 -10.392,12 -51.962,-12"></polygon></g><g clip-path="url(#iso3-lit)" class="iso-grain"><g mask="url(#iso3-grainmask)"><rect x="-170" y="-150" width="342" height="342" filter="url(#iso3-grain)"></rect></g></g></svg>
